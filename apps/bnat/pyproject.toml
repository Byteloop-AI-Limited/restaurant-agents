[project]
name = "bnat-agent"
version = "0.1.0"
description = "Burger Nation restaurant agent"
requires-python = ">=3.13,<3.14"
dependencies = ["restaurant-agent-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bnat_agent"]
