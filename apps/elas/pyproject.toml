[project]
name = "elas-agent"
version = "0.1.0"
description = "Elai / Wings and Things restaurant agent"
requires-python = ">=3.13,<3.14"
dependencies = ["restaurant-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elas_agent"]
