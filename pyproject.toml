[tool.uv.workspace]
members = [
    "packages/restaurant-agent-runtime",
    "apps/sfcs",
    "apps/bnat",
]

[tool.uv.sources]
restaurant-agent-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.15.7",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["F"]
ignore = ["F704"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps/sfcs/tests", "apps/bnat/tests"]
norecursedirs = ["tests/legacy_contract"]
pythonpath = [
    "packages/restaurant-agent-runtime/src",
    "apps/sfcs/src",
    "apps/bnat/src",
]
